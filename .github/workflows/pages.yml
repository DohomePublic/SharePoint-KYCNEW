# ============================================================================
# Deploy Dashboard ขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push เข้า branch main
# ตั้งค่าที่ GitHub: Settings › Pages › Source = "GitHub Actions"
# ============================================================================
name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # กดสั่ง deploy เองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      # เป็น static site ล้วน จึงอัปโหลดทั้งโฟลเดอร์ได้เลย ไม่ต้อง build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
