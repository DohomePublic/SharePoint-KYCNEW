name: Update Dashboard

# ─────────────────────────────────────────────────────────────
# ดึงข้อมูลจาก SharePoint List (DemoApp + Admin_KycNew)
# แล้ว build index.html ใหม่ → commit → deploy GitHub Pages
#
# ออกแบบให้ "ล้มเหลวแบบดัง" — ถ้าดึงข้อมูลสดไม่ได้ workflow จะเป็นสีแดง
# ไม่ใช่เขียวทั้งที่ข้อมูลเก่า (REQUIRE_LIVE)
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # ทุก 30 นาที ระหว่าง 00:00–13:00 UTC = 07:00–20:00 เวลาไทย (จ.-ศ.)
    - cron: "0,30 0-13 * * 1-5"
    # รอบสรุปสิ้นวัน 21:00 เวลาไทย
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      mask_pii:
        description: "ปิดบังข้อมูลส่วนบุคคล (ใช้เมื่อ Pages เป็น public)"
        type: boolean
        default: false
      require_live:
        description: "บังคับดึงสดเท่านั้น (ปิด = ยอมให้ fallback CSV)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# GitHub Pages อนุญาตให้ deploy ได้ทีละชุดเท่านั้น
# ถ้าตั้งกลุ่มไม่ตรงกับที่ Pages ใช้ จะเกิดคิวซ้อนกันจนค้างที่ purging_cdn
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard from SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── ตรวจ secret ก่อนเริ่ม เพื่อไม่ให้ไปตกโหมด CSV เงียบ ๆ ──
      - name: Preflight · ตรวจ secrets
        env:
          # รองรับทั้งชื่อที่มี AZ_ นำหน้า และชื่อเดิม (ใช้ตัวไหนก็ได้)
          TENANT_ID: ${{ secrets.AZ_TENANT_ID || secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZ_CLIENT_ID || secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET || secrets.CLIENT_SECRET }}
        shell: bash
        run: |
          set -u
          missing=""
          dirty=""

          {
            echo "## 🔍 ผลตรวจ Secrets"
            echo ""
            echo "| Secret | สถานะ | ความยาว | รูปแบบ |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          check() {
            name="$1"; val="$2"; expect="$3"
            len=${#val}
            trimmed="$(printf '%s' "$val" | tr -d '[:space:]')"
            tlen=${#trimmed}

            if [ "$len" -eq 0 ]; then
              missing="$missing $name"
              echo "| \`$name\` | ❌ ไม่พบ / ว่าง | 0 | — |" >> "$GITHUB_STEP_SUMMARY"
              echo "❌ $name : ไม่ได้ตั้งค่า หรือเป็นค่าว่าง"
              return
            fi

            note="ok"
            if [ "$len" -ne "$tlen" ]; then
              dirty="$dirty $name"
              note="⚠️ มีช่องว่าง/ขึ้นบรรทัดใหม่ปนมา"
            elif [ -n "$expect" ] && ! printf '%s' "$val" | grep -qE "$expect"; then
              dirty="$dirty $name"
              note="⚠️ รูปแบบไม่ตรงที่คาด"
            fi

            echo "| \`$name\` | ✅ พบ | $len | $note |" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ $name : พบค่า (ยาว $len อักขระ) $note"
          }

          # GUID = 8-4-4-4-12
          guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          check TENANT_ID     "${TENANT_ID:-}"     "$guid"
          check CLIENT_ID     "${CLIENT_ID:-}"     "$guid"
          check CLIENT_SECRET "${CLIENT_SECRET:-}" ""

          # client secret VALUE ยาว ~40 อักขระ ส่วน secret ID เป็น GUID 36 ตัว
          if [ -n "${CLIENT_SECRET:-}" ] && printf '%s' "$CLIENT_SECRET" | grep -qE "$guid"; then
            echo "::error title=CLIENT_SECRET ผิดช่อง::ค่าที่ใส่เป็น GUID ซึ่งคือ 'Secret ID' ไม่ใช่ 'Value'"
            echo "### ⚠️ CLIENT_SECRET ดูเหมือนเป็น **Secret ID** ไม่ใช่ **Value**" >> "$GITHUB_STEP_SUMMARY"
            echo "ใน Azure Portal ให้คัดลอกคอลัมน์ **Value** (ยาวประมาณ 40 อักขระ) ไม่ใช่ **Secret ID**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::error title=ไม่พบ Secrets::ขาด$missing -> ตั้งที่ Settings > Secrets and variables > Actions"
            {
              echo ""
              echo "### ❌ ขาด Secrets:$missing"
              echo ""
              echo "**นี่คือสาเหตุที่ข้อมูลไม่อัปเดต** — ถ้าไม่บังคับ REQUIRE_LIVE สคริปต์จะไปอ่าน CSV เก่าใน \`data/\` แทน"
              echo ""
              echo "#### วิธีแก้ทีละขั้น"
              echo ""
              echo "1. ไปที่ **Settings → Secrets and variables → Actions** (แท็บ **Secrets**)"
              echo "2. กด **New repository secret**"
              echo "3. เพิ่มให้ครบ 3 ตัว ชื่อ **ตัวพิมพ์ใหญ่ทั้งหมด** ห้ามมีช่องว่าง"
              echo "   (workflow รองรับทั้งแบบมี \`AZ_\` นำหน้า และแบบไม่มี):"
              echo "   - \`AZ_TENANT_ID\` หรือ \`TENANT_ID\` — Directory (tenant) ID (GUID)"
              echo "   - \`AZ_CLIENT_ID\` หรือ \`CLIENT_ID\` — Application (client) ID (GUID)"
              echo "   - \`AZ_CLIENT_SECRET\` หรือ \`CLIENT_SECRET\` — ค่าในคอลัมน์ **Value** ของ Client secret"
              echo ""
              echo "> ⚠️ ต้องอยู่ใต้ **Repository secrets** เท่านั้น"
              echo "> ถ้าใส่ไว้ใน **Environment secrets** หรือ **Dependabot secrets** workflow จะมองไม่เห็น"
              echo ""
              echo "> ⚠️ ถ้าเป็น Fork หรือ PR จาก fork GitHub จะไม่ส่ง secrets ให้เพื่อความปลอดภัย"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$dirty" ]; then
            echo "::warning title=รูปแบบ Secret น่าสงสัย::ตรวจสอบ$dirty อีกครั้ง"
          fi

          echo "✅ พบ secrets ครบ 3 ตัว"

      - name: Verify script syntax
        run: python -m py_compile scripts/build_dashboard.py

      - name: Build index.html from SharePoint
        env:
          TENANT_ID: ${{ secrets.AZ_TENANT_ID || secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZ_CLIENT_ID || secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          SITE_HOSTNAME: ${{ vars.SITE_HOSTNAME || 'dohomegroup.sharepoint.com' }}
          SITE_PATH: ${{ vars.SITE_PATH || '/sites/AC-Accounting' }}
          LIST_DEMOAPP: ${{ vars.LIST_DEMOAPP || 'DemoApp' }}
          LIST_ACL: ${{ vars.LIST_ACL || 'Admin_KycNew' }}
          MASK_PII: ${{ inputs.mask_pii }}
          # schedule/push ไม่มี inputs -> default เป็น true (บังคับดึงสด)
          REQUIRE_LIVE: ${{ inputs.require_live == false && 'false' || 'true' }}
        run: python scripts/build_dashboard.py --out index.html --min-records 1

      - name: Verify output
        run: |
          test -s index.html
          grep -q "RAW_DATA"     index.html
          grep -q "ACL_REGISTRY" index.html
          # ต้องเป็นข้อมูลสดเท่านั้น — ถ้าพบ "CSV snapshot" แปลว่า fallback
          if grep -q "CSV snapshot" index.html; then
            echo "::error title=ข้อมูลไม่สด::index.html ถูกสร้างจาก CSV ไม่ใช่ SharePoint"
            exit 1
          fi
          echo "--- build-info.json ---"
          cat build-info.json

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build-info.json
          if git diff --cached --quiet; then
            echo "ℹ️ ไฟล์ไม่เปลี่ยนแปลง — ไม่ต้อง commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "✅ อัปเดต index.html แล้ว"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── จัดชุดไฟล์ที่จะเผยแพร่ ──
      # เดิมใช้ path: . ซึ่งอัปโหลด "ทั้ง repo" ขึ้น Pages
      #   1) ทำให้ artifact ใหญ่เกินจำเป็น → CDN purge ช้า → ค้างที่ purging_cdn
      #   2) 🔴 เผยแพร่ data/*.csv (ข้อมูลลูกค้าดิบ + อีเมล 65 บัญชี) และ scripts/ สู่สาธารณะ
      - name: Stage site files
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html      _site/
          cp build-info.json _site/
          touch _site/.nojekyll
          # กันไฟล์ต้องห้ามหลุดขึ้น Pages โดยไม่ตั้งใจ
          if find _site -name "*.csv" -o -name "*.py" | grep -q .; then
            echo "::error title=พบไฟล์ต้องห้ามใน _site::ต้องไม่มี .csv หรือ .py"
            exit 1
          fi
          echo "ไฟล์ที่จะเผยแพร่:"; ls -la _site
          echo "ขนาดรวม: $(du -sh _site | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # ข้าม deploy เมื่อไฟล์ไม่เปลี่ยน — ลดจำนวน deployment ที่ไปแย่งคิว CDN purge
    # (schedule ทุก 30 นาที ถ้า deploy ทุกครั้งจะเกิดคิวซ้อนจนค้าง)
    if: needs.build.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # ค่า default คือ 10 นาที (600000 ms) แต่ขั้น purging_cdn ของ Pages
          # บางช่วงใช้เวลานานกว่าปกติ → ขยายเป็น 20 นาที และผ่อนเกณฑ์ error
          timeout: 1200000
          error_count: 15
          reporting_interval: 10000

      # purging_cdn ค้างมักเป็นอาการชั่วคราวฝั่ง GitHub — ลองซ้ำอีกครั้งก่อนยอมแพ้
      - name: Deploy (retry)
        id: deployment_retry
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 15
          reporting_interval: 10000

      - name: อธิบายเมื่อ deploy ไม่สำเร็จ
        if: failure()
        run: |
          {
            echo "## ❌ Deploy to GitHub Pages ไม่สำเร็จ (purging_cdn / Timeout)"
            echo ""
            echo "**index.html ถูก build และ commit ขึ้น repo เรียบร้อยแล้ว** — ข้อมูลไม่หาย"
            echo "ที่ล้มเหลวคือขั้นเผยแพร่ขึ้น CDN ของ GitHub Pages เท่านั้น"
            echo ""
            echo "### สาเหตุที่พบบ่อย"
            echo "1. **GitHub Pages ขัดข้องชั่วคราว** — เช็คที่ https://www.githubstatus.com"
            echo "2. **มี deployment ค้างคิวอยู่** — ไปที่แท็บ **Actions → Deployments** แล้วยกเลิกอันที่ค้าง"
            echo "3. **artifact ใหญ่เกินไป** — workflow นี้เผยแพร่เฉพาะ \`index.html\` + \`build-info.json\` แล้ว"
            echo ""
            echo "### วิธีแก้"
            echo "- รอ 10–15 นาที แล้วสั่ง **Run workflow** ใหม่ (ส่วน build จะข้ามถ้าข้อมูลไม่เปลี่ยน)"
            echo "- ถ้าค้างซ้ำ ๆ ให้ไปที่ **Settings → Pages** เปลี่ยน Source เป็น *Deploy from a branch* (\`main\` / root)"
            echo "  ซึ่งไม่ต้องพึ่งขั้น CDN purge เลย — index.html ถูก commit ลง main อยู่แล้ว"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success()
        run: |
          {
            echo "## 🚀 Deploy สำเร็จ"
            echo ""
            echo "URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
            echo ""
            echo "ถ้าเปิดแล้วยังเห็นข้อมูลเก่า ให้กด Ctrl+Shift+R (hard refresh)"
            echo "หรือต่อท้าย URL ด้วย ?v=$(date +%s) เพื่อข้ามแคชเบราว์เซอร์"
          } >> "$GITHUB_STEP_SUMMARY"
