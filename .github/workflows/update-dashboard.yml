name: Build KYC Daily Dashboard

on:
  schedule:
    - cron: "0 1 * * *"          # 01:00 UTC = 08:00 น. ประเทศไทย ทุกวัน
  workflow_dispatch:
    inputs:
      list_data:
        description: "ชื่อ SharePoint List ข้อมูล"
        default: "KYC_DATA_NEW"
        required: false
      offline:
        description: "build จาก data/sample_data.json (ไม่ต่อ SharePoint)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyc-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Smoke test (offline build ต้องผ่านเสมอ)
        run: |
          OUT_FILE=dist/_smoke.html python scripts/build_dashboard.py --offline data/sample_data.json
          test -s dist/_smoke.html
          grep -q "__DATA__" dist/_smoke.html && { echo "placeholder ไม่ถูกแทนที่"; exit 1; } || echo "placeholder OK"
          rm -f dist/_smoke.html

      - name: Build dashboard (live from SharePoint)
        if: ${{ github.event.inputs.offline != 'true' }}
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SP_HOST:       dohomegroup.sharepoint.com
          SP_SITE_PATH:  /sites/AC-Accounting
          SP_LIST_DATA:  ${{ github.event.inputs.list_data || 'KYC_DATA_NEW' }}
          SP_LIST_GROUP: Admin_KycNew
          OUT_FILE:      dist/KYC_Daily_Dashboard.html
        run: python scripts/build_dashboard.py

      - name: Build dashboard (offline fallback)
        if: ${{ github.event.inputs.offline == 'true' }}
        env:
          OUT_FILE: dist/KYC_Daily_Dashboard.html
        run: python scripts/build_dashboard.py --offline data/sample_data.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyc-daily-dashboard
          path: dist/KYC_Daily_Dashboard.html
          retention-days: 30

      # ---- (ตัวเลือก) เผยแพร่ขึ้น GitHub Pages ----
      - name: Prepare Pages
        if: github.ref == 'refs/heads/main'
        run: cp dist/KYC_Daily_Dashboard.html dist/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
