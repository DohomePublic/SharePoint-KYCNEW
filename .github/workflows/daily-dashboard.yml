name: Daily KYC Dashboard Build

# =====================================================================
#  รันอัตโนมัติทุกวัน 07:00 น. (เวลาไทย ICT = UTC+7)
#  cron ของ GitHub Actions ใช้ UTC -> 00:00 UTC = 07:00 ICT
#  สั่งรันเองได้ผ่านปุ่ม "Run workflow" (workflow_dispatch)
# =====================================================================
on:
  schedule:
    - cron: "0 0 * * *"        # 07:00 ICT ทุกวัน
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write               # ใช้ commit + push index.html กลับเข้า repo
  pages: write
  id-token: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1) เอา source ล่าสุด ----------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 2) เตรียม Python ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests

      # ---------- 3) ดึงข้อมูลจาก SharePoint (Microsoft Graph API) ----------
      #  หมายเหตุ: map ทั้งชื่อ AZ_* และชื่อไม่มี prefix
      #  ตั้ง Secret ไว้แบบไหนก็ใช้ได้ อีกตัวจะเป็นค่าว่างและถูกข้ามไปเอง
      - name: Fetch SharePoint data
        env:
          AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
          AZ_CLIENT_ID: ${{ secrets.AZ_CLIENT_ID }}
          AZ_CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SP_HOSTNAME: dohomegroup.sharepoint.com
          SP_SITE_PATH: /sites/AC-Accounting
          MAIN_LIST: DemoApp
          SEC_LIST: Admin_KycNew
        run: python scripts/fetch_sharepoint.py

      # ---------- 4) สร้าง index.html ใหม่พร้อมข้อมูลล่าสุด ----------
      - name: Build dashboard
        env:
          SLA_DAYS: "2"
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: python scripts/build_dashboard.py

      # ---------- 5) Commit + Push ----------
      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/dataset.json
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลง — ข้ามการ commit"
          else
            git commit -m "chore(dashboard): daily build $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # ---------- 6) Deploy GitHub Pages ----------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
